version: "3.8"

services:
  kakeibo-app:
    build:
      context: .
      dockerfile: Dockerfile
      # 毎ビルド異なる BUILD_DATE を渡し、Dockerfile 側の
      # レイヤーキャッシュを強制的に無効化する。
      # ※ Compose は変数展開でシェル環境変数を参照するため、
      #    ビルド時に export BUILD_DATE=$(date -u +%Y%m%d%H%M%S) してから
      #    docker compose up -d --build を実行するか、
      #    下記のように固定値を書き換えてビルドし直してください。
      args:
        BUILD_DATE: "${BUILD_DATE:-manual}"
    image: kakeibo-app:latest
    container_name: kakeibo
    restart: unless-stopped
    ports:
      - "9090:80"          # ホスト側:コンテナ側 (例: http://<UGREEN_NAS_IP>:9090 でアクセス)
    volumes:
      - ./data:/app/data           # SQLite等の永続化データベース
      - ./backups:/app/backups     # バックアップデータ保存先
    environment:
      - TZ=Asia/Tokyo
      - NODE_ENV=production
      - APP_PORT=80
      - DB_PATH=/app/data/kakeibo.db
    networks:
      - kakeibo-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  kakeibo-net:
    driver: bridge
